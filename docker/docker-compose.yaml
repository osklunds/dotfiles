
services:
  dev-env:
    image: dev-env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-env
    init: true
    hostname: dev-env
    environment:
      - DISPLAY=${DISPLAY}
      # REPOS_DIR is the location from the current system's perspective.
      # Since it's the host starting the container, REPOS_DIR is the location
      # of the directory containing this repo from the host's perspective.
      # HOST_REPOS_DIR is the same path inside the container.
      # REPOS_DIR becomes the same as HOST_REPOS_DIR inside the container,
      # but calculated in a different way.
      - HOST_REPOS_DIR=${REPOS_DIR} 
    volumes:
      # Host access
      - /:/root/host_root
      - ${HOME}:/root/host_home
      
      # Repos
      # For docker sibling containers to work, path inside container and on
      # host need to be the same
      - ${REPOS_DIR}:${REPOS_DIR}

      # Cache
      - dev-env-emacs-cache:/root/.emacs.d

    command:
      # Symlink HOST_REPOS_DIR to a predicable and static path
      - /bin/bash
      - -c
      - |
        ln -s "$$HOST_REPOS_DIR" /root/own_repos
        ln -s /root/own_repos/dotfiles/.bashrc /root/.bashrc
        ln -s /root/own_repos/dotfiles/.emacs /root/.emacs
        ln -s /root/own_repos/dotfiles/.gitconfig /root/.gitconfig
        sleep 100d
volumes:
  dev-env-emacs-cache:

